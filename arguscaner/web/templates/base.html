<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070a11">
    <title>{% block title %}ArguScanner{% endblock %}</title>
    <script>
    (function () {
        try {
            var t = localStorage.getItem('argus-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* storage unavailable */ }
    })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f8cff'/%3E%3Ccircle cx='12' cy='12' r='6.5' fill='none' stroke='white' stroke-width='1.5'/%3E%3Ccircle cx='12' cy='12' r='2' fill='white'/%3E%3Cpath d='M12 12l5-5' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
{% set current = request.path %}
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-radar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><path d="M12 12l6.2-6.2"/>
    </symbol>
    <symbol id="i-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v5h5"/><path d="M12 7.5V12l3 1.8"/>
    </symbol>
    <symbol id="i-plug" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 2.5v6M15 2.5v6"/><path d="M6 8.5h12v2.8a6 6 0 0 1-12 0z"/><path d="M12 17.3v4.2"/>
    </symbol>
    <symbol id="i-flow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/>
        <path d="M7 6h10M6 7.8l5 8.4M18 7.8l-5 8.4"/>
    </symbol>
    <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.56 1.7 1.7 0 0 0 10.03 3V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.1 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.44 9v.09A1.7 1.7 0 0 0 21 10.03h.09a2 2 0 1 1 0 4H21a1.7 1.7 0 0 0-1.6 1z"/>
    </symbol>
    <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </symbol>
    <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16M4 12h16M4 18h16"/>
    </symbol>
    <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 18v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12.5l5 5L20 6.5"/>
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 6l12 12M18 6L6 18"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.5L2.8 19.5h18.4z"/><path d="M12 9v4.5M12 17h.01"/>
    </symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M13 6l6 6-6 6"/>
    </symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
    </symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 13h4l2 3h4l2-3h4"/><path d="M5.5 5h13l1.5 8v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-5z"/>
    </symbol>
</svg>

<aside class="sidebar" id="sidebar">
    <a class="brand" href="/">
        <span class="brand-mark"><svg><use href="#i-radar"/></svg></span>
        <span>
            <span class="brand-name">ArguScanner</span>
            <span class="brand-version">RECON CONSOLE · v0.1.0</span>
        </span>
    </a>

    <nav>
        <div class="nav-group">
            <div class="nav-group-label">扫描</div>
            <a class="nav-link {{ 'active' if current == '/' }}" href="/">
                <svg><use href="#i-radar"/></svg>新建扫描
            </a>
            <a class="nav-link {{ 'active' if current.startswith('/history') or current.startswith('/status') or current.startswith('/results') or current.startswith('/batch') }}" href="/history">
                <svg><use href="#i-history"/></svg>历史任务
            </a>
        </div>
        <div class="nav-group">
            <div class="nav-group-label">管理</div>
            <a class="nav-link {{ 'active' if current.startswith('/plugins') }}" href="/plugins">
                <svg><use href="#i-plug"/></svg>插件
            </a>
            <a class="nav-link {{ 'active' if current.startswith('/pipeline') }}" href="/pipeline">
                <svg><use href="#i-flow"/></svg>流程
            </a>
            <a class="nav-link {{ 'active' if current.startswith('/settings') }}" href="/settings">
                <svg><use href="#i-gear"/></svg>设置
            </a>
            <a class="nav-link {{ 'active' if current.startswith('/proxy') }}" href="/proxy">
                <svg><use href="#i-globe"/></svg>代理
            </a>
        </div>
    </nav>

    <div class="sidebar-foot">
        <div class="sidebar-status">
            <span class="status-dot"></span>本地服务运行中
        </div>
        <div class="sidebar-tools">
            <button class="btn btn-ghost btn-icon theme-toggle" type="button" onclick="toggleTheme()" title="切换深浅色主题" aria-label="切换主题">
                <svg class="icon-sun"><use href="#i-sun"/></svg>
                <svg class="icon-moon"><use href="#i-moon"/></svg>
            </button>
        </div>
    </div>
</aside>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<header class="topbar">
    <button class="btn btn-ghost btn-icon" type="button" onclick="openSidebar()" aria-label="打开导航">
        <svg><use href="#i-menu"/></svg>
    </button>
    <a class="brand" href="/">
        <span class="brand-mark"><svg><use href="#i-radar"/></svg></span>
        <span class="brand-name">ArguScanner</span>
    </a>
    <div class="topbar-actions">
        <button class="btn btn-ghost btn-icon theme-toggle" type="button" onclick="toggleTheme()" aria-label="切换主题">
            <svg class="icon-sun"><use href="#i-sun"/></svg>
            <svg class="icon-moon"><use href="#i-moon"/></svg>
        </button>
    </div>
</header>

<main class="main">
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <footer class="footer">
        ArguScanner v0.1.0 · 红蓝队信息收集工具
    </footer>
</main>

<div id="toast-container"></div>

<script>
function toggleTheme() {
    var root = document.documentElement;
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('argus-theme', next); } catch (e) { /* ignore */ }
}

function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebar-overlay').classList.add('show');
}

function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('show');
}

document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSidebar();
});

function escapeHtml(value) {
    return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function showToast(msg, type) {
    type = type || 'info';
    var container = document.getElementById('toast-container');
    var toast = document.createElement('div');
    toast.className = 'toast toast-' + type;
    var text = document.createElement('span');
    text.textContent = msg;
    toast.appendChild(text);
    var close = document.createElement('span');
    close.className = 'toast-close';
    close.textContent = '\u00d7';
    close.onclick = function () { toast.remove(); };
    toast.appendChild(close);
    container.appendChild(toast);
    setTimeout(function () { toast.remove(); }, 6000);
}
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
