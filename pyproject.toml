[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arguscaner"
version = "0.1.0"
description = "ArguScanner - One-click recon tool for red/blue team operations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "ArguScanner Team"},
]
keywords = ["recon", "security", "scanner", "pentest", "redteam"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "flask>=3.0",
    "networkx>=2.8",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
auto-recon = "arguscaner.entrypoint:app"

[tool.setuptools.packages.find]
include = ["arguscaner*"]

[tool.setuptools.package-data]
arguscaner = ["tools/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
